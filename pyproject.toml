[project]
name = "pwa-toolkit"
version = "1.0.0"
description = "Ingest a pilot working agreement PDF into searchable text, and search it with Claude Code"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    # Batches API for the reference handbooks. The contract pipeline calls the
    # Messages API over plain HTTP and does not need this.
    "anthropic>=0.40",
]

[project.urls]
Homepage = "https://github.com/bronco21016/pwa-toolkit"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pipeline"]
